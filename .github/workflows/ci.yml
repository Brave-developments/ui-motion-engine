name: Engine tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: JavaScript syntax checks
        run: |
          for f in server/*.mjs scripts/*.mjs studio/app.js tests/*.mjs; do node --check "$f"; done
      - name: Unit tests and storyboard validation
        run: npm test
